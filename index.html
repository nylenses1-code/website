<section id="proofing-portal">
  <div class="sec-wrap">
    <div class="portal-container">

      <div class="sec-head" style="text-align:center;">
        <p class="sec-label" style="justify-content:center;">
          Secure Access
        </p>

        <h2 class="sec-title">
          Client Proofing Portal
        </h2>
      </div>

      <p class="portal-desc">
        Enter your gallery name below to access your photos.
      </p>

      <div class="portal-box">

        <input
          type="text"
          id="portalCode"
          class="portal-input"
          placeholder="Enter Gallery Name..."
          autocomplete="off"
        >

        <button
          type="button"
          class="portal-btn"
          onclick="checkPortalCode()"
        >
          Access Gallery →
        </button>

      </div>

    </div>
  </div>
</section>

<script>

function checkPortalCode() {

  const code = document
    .getElementById('portalCode')
    .value
    .trim()
    .toLowerCase()
    .replace(/\s+/g, '');

  if (!code) return;

  const galleryURL =
    `https://nylenses.pixieset.com/${code}/`;

  window.open(galleryURL, '_blank');
}

document
  .getElementById('portalCode')
  .addEventListener('keydown', function(e) {

    if (e.key === 'Enter') {
      checkPortalCode();
    }

  });

</script>
