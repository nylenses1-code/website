/* ========================= */
/* IMAGE OBSERVER */
/* ========================= */

const imgObserver = new IntersectionObserver((entries, obs) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const img = e.target;

      if (img.dataset.src) {
        img.src = img.dataset.src;
        img.removeAttribute('data-src');
      }

      obs.unobserve(img);
    }
  });
}, {
  rootMargin: '350px 0px',
  threshold: 0.01
});

/* ========================= */
/* NAV SCROLL EFFECT */
/* ========================= */

let scrollingTicking = false;

window.addEventListener('scroll', () => {
  if (!scrollingTicking) {
    window.requestAnimationFrame(() => {
      const nav = document.getElementById('siteNav');

      if (window.scrollY > 40) {
        nav.classList.add('scrolled');
      } else {
        nav.classList.remove('scrolled');
      }

      scrollingTicking = false;
    });

    scrollingTicking = true;
  }
}, { passive: true });

/* ========================= */
/* CALENDAR */
/* ========================= */

let calendarDate = new Date();
let chosenDateString = "";

const monthNames = [
  "January","February","March","April","May","June",
  "July","August","September","October","November","December"
];

function buildCalendar() {
  const currentYear = calendarDate.getFullYear();
  const currentMonth = calendarDate.getMonth();

  document.getElementById('calendarMonthTitle').textContent =
    `${monthNames[currentMonth]} ${currentYear}`;

  const initialDayIndex =
    new Date(currentYear, currentMonth, 1).getDay();

  const totalDaysCount =
    new Date(currentYear, currentMonth + 1, 0).getDate();

  const daysGridContainer =
    document.getElementById('calendarDaysGrid');

  daysGridContainer.innerHTML = '';

  for (let i = 0; i < initialDayIndex; i++) {
    const spaceBlock = document.createElement('div');
    spaceBlock.className = 'calendar-day empty';
    daysGridContainer.appendChild(spaceBlock);
  }

  const realTimeToday = new Date();

  for (let dayNum = 1; dayNum <= totalDaysCount; dayNum++) {
    const dayCell = document.createElement('div');

    dayCell.className = 'calendar-day';
    dayCell.textContent = dayNum;

    const evaluationDate =
      new Date(currentYear, currentMonth, dayNum);

    evaluationDate.setHours(23,59,59,999);

    if (evaluationDate < realTimeToday) {
      dayCell.classList.add('disabled');
    } else {
      const standardFormatStr =
        `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;

      if (standardFormatStr === chosenDateString) {
        dayCell.classList.add('selected');
      }

      dayCell.onclick = () => {
        document
          .querySelectorAll('.calendar-day')
          .forEach(cell => cell.classList.remove('selected'));

        dayCell.classList.add('selected');

        chosenDateString = standardFormatStr;

        document.getElementById('selectedDateInput').value =
          chosenDateString;
      };
    }

    daysGridContainer.appendChild(dayCell);
  }
}

document.getElementById('prevMonthBtn').onclick = () => {
  const today = new Date();

  if (
    calendarDate.getFullYear() > today.getFullYear() ||
    (
      calendarDate.getFullYear() === today.getFullYear() &&
      calendarDate.getMonth() > today.getMonth()
    )
  ) {
    calendarDate.setMonth(calendarDate.getMonth() - 1);
    buildCalendar();
  }
};

document.getElementById('nextMonthBtn').onclick = () => {
  calendarDate.setMonth(calendarDate.getMonth() + 1);
  buildCalendar();
};

buildCalendar();

/* GALLERY */
/* ========================= */

function renderGallery(cat) {
  const grid = document.getElementById('gGrid');
  const frag = document.createDocumentFragment();
  const list = photos[cat] || [];

  activeList = list;

  if (list.length === 0) {
    for (let i = 0; i < 3; i++) {
      const d = document.createElement('div');

      d.className = 'g-soon';
      d.textContent = 'Coming Soon';

      frag.appendChild(d);
    }

    grid.innerHTML = '';
    grid.appendChild(frag);

    return;
  }

  list.forEach((file, idx) => {
    const wrap = document.createElement('div');

    wrap.className = 'g-item';
    wrap.onclick = () => openLB(idx);

    const img = document.createElement('img');

    img.alt = 'NY Lenses photography display element';
    img.decoding = 'async';

    img.addEventListener('load', function () {
      this.classList.add('loaded');
    });

    if (idx < 4) {
      img.src = BASE + encodeURIComponent(file);

      if (img.complete) {
        img.classList.add('loaded');
      }
    } else {
      img.dataset.src =
        BASE + encodeURIComponent(file);

      img.src =
        'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

      imgObserver.observe(img);
    }

    const ov = document.createElement('div');
    ov.className = 'g-overlay';

    const zoom = document.createElement('span');

    zoom.className = 'g-zoom';
    zoom.textContent = '⊕';

    ov.appendChild(zoom);

    const wm = document.createElement('span');

    wm.className = 'g-watermark';
    wm.textContent = '© NY Lenses';

    wrap.appendChild(img);
    wrap.appendChild(ov);
    wrap.appendChild(wm);

    frag.appendChild(wrap);
  });

  grid.innerHTML = '';
  grid.appendChild(frag);
}

document.querySelectorAll('.g-tab').forEach(t => {

    document

      .forEach(x => x.classList.remove('active'));

    t.classList.add('active');

    activeCat = t.dataset.cat;

    renderGallery(activeCat);
  });
});

/* ========================= */
/* LIGHTBOX */
/* ========================= */

function openLB(idx) {
  lbIndex = idx;

  const lbImg = document.getElementById('lb-img');

  lbImg.src =
    BASE + encodeURIComponent(activeList[idx]);

  const lb = document.getElementById('lightbox');

  lb.style.display = 'flex';

  setTimeout(() => {
    lb.classList.add('open');
  }, 10);

  document.body.style.overflow = 'hidden';
}

function closeLB() {
  const lb = document.getElementById('lightbox');

  lb.classList.remove('open');

  document.body.style.overflow = '';

  setTimeout(() => {
    if (!lb.classList.contains('open')) {
      lb.style.display = 'none';

      document.getElementById('lb-img').src = '';
    }
  }, 300);
}

function switchLBImage(newIdx) {
  const lbImg = document.getElementById('lb-img');

  lbImg.classList.add('switching');

  const preloadImg = new Image();

  preloadImg.src =
    BASE + encodeURIComponent(activeList[newIdx]);

  preloadImg.onload = () => {
    setTimeout(() => {
      lbIndex = newIdx;

      lbImg.src = preloadImg.src;

      lbImg.classList.remove('switching');
    }, 100);
  };
}

function prevLB() {
  const newIdx =
    (lbIndex - 1 + activeList.length) %
    activeList.length;

  switchLBImage(newIdx);
}

function nextLB() {
  const newIdx =
    (lbIndex + 1) %
    activeList.length;

  switchLBImage(newIdx);
}

document.getElementById('lbClose').onclick = closeLB;
document.getElementById('lb-prev').onclick = prevLB;
document.getElementById('lb-next').onclick = nextLB;

document
  .getElementById('lightbox')
  .addEventListener('click', e => {
    if (e.target.id === 'lightbox') {
      closeLB();
    }
  });

document.addEventListener('keydown', e => {
  if (
    !document
      .getElementById('lightbox')
      .classList.contains('open')
  ) return;

  if (e.key === 'Escape') closeLB();
  if (e.key === 'ArrowLeft') prevLB();
  if (e.key === 'ArrowRight') nextLB();
});
