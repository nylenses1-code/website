// --- DYNAMIC NAVIGATION BAR MANIPULATION ---
window.addEventListener('scroll', () => {
  const nav = document.getElementById('siteNav');
  if (window.scrollY > 40) {
    nav.classList.add('scrolled');
  } else {
    nav.classList.remove('scrolled');
  }
});

// --- PERFORMANCE OPTIMIZED GALLERY CONTROLLER ---
const imgObserver = new IntersectionObserver((entries, obs) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const img = entry.target;
      if (img.dataset.src) {
        img.src = img.dataset.src;
        img.removeAttribute('data-src');
      }
      obs.unobserve(img);
    }
  });
}, { rootMargin: '350px' });

function renderGallery(cat) {
  const grid = document.getElementById('gGrid');
  const frag = document.createDocumentFragment();
  const list = photos[cat] || [];
  activeList = list;
  activeCat = cat;

  if (list.length === 0) {
    for (let i = 0; i < 3; i++) {
      const emptyBox = document.createElement('div');
      emptyBox.className = 'g-soon';
      emptyBox.textContent = 'Production Directory Coming Soon';
      frag.appendChild(emptyBox);
    }
    grid.innerHTML = '';
    grid.appendChild(frag);
    return;
  }

  list.forEach((file, idx) => {
    const item = document.createElement('div');
    item.className = 'g-item';
    item.onclick = () => openLightbox(idx);

    const img = document.createElement('img');
    img.alt = `NY Lenses Showcase Portfolio asset item ${idx + 1}`;
    img.decoding = 'async';
    
    img.addEventListener('load', function() {
      this.classList.add('loaded');
    });

    if (idx < 4) {
      img.src = BASE + file;
    } else {
      img.dataset.src = BASE + file;
      img.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
      imgObserver.observe(img);
    }

    const overlay = document.createElement('div');
    overlay.className = 'g-overlay';
    const zoom = document.createElement('span');
    zoom.className = 'g-zoom';
    zoom.textContent = '⊕';
    overlay.appendChild(zoom);

    const watermark = document.createElement('span');
    watermark.className = 'g-watermark';
    watermark.textContent = '© NY Lenses';

    item.appendChild(img);
    item.appendChild(overlay);
    item.appendChild(watermark);
    frag.appendChild(item);
  });

  grid.innerHTML = '';
  grid.appendChild(frag);
}

// --- LIGHTBOX CONTROLS ---
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');

function openLightbox(index) {
  lbIndex = index;
  updateLightboxImage();
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
}

function updateLightboxImage() {
  lbImg.classList.add('switching');
  setTimeout(() => {
    lbImg.src = BASE + activeList[lbIndex];
    lbImg.classList.remove('switching');
  }, 120);
}

function nextLightboxImg() {
  if (activeList.length === 0) return;
  lbIndex = (lbIndex + 1) % activeList.length;
  updateLightboxImage();
}

function prevLightboxImg() {
  if (activeList.length === 0) return;
  lbIndex = (lbIndex - 1 + activeList.length) % activeList.length;
  updateLightboxImage();
}

document.getElementById('lbClose').onclick = closeLightbox;
document.getElementById('lb-next').onclick = nextLightboxImg;
document.getElementById('lb-prev').onclick = prevLightboxImg;

lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) closeLightbox();
});

document.addEventListener('keydown', (e) => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowRight') nextLightboxImg();
  if (e.key === 'ArrowLeft') prevLightboxImg();
});

// --- AUTOMATED NO-MAINTENANCE CLIENT PROOFING ROUTER ---
function checkPortalCode() {
  const codeInput = document.getElementById('portalCode').value.trim();
  
  if (!codeInput) return;

  // IMPORTANT: Replace 'nylenses' below with your actual custom Pixieset prefix if it changes!
  const pixiesetHomepage = 'https://nylenses.pixieset.com/'; 
  
  // Directly passes code into Pixieset search parameter to auto-filter and open client directory folder safely
  window.open(pixiesetHomepage + '?search=' + encodeURIComponent(codeInput), '_blank');
}

// Wire up input box to trigger the redirect if client hits "Enter" key on keyboard or phone
document.getElementById('portalCode').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') {
    checkPortalCode();
  }
});

// --- CALENDAR MANAGEMENT CORE ---
let currentCalendarDate = new Date();
let selectedDate = null;

const monthsList = [
  "January", "February", "March", "April", "May", "June", 
  "July", "August", "September", "October", "November", "December"
];

function generateCalendar() {
  const year = currentCalendarDate.getFullYear();
  const month = currentCalendarDate.getMonth();
  
  document.getElementById('calendarMonthYear').textContent = `${monthsList[month]} ${year}`;
  
  const firstDayIndex = new Date(year, month, 1).getDay();
  const totalDays = new Date(year, month + 1, 0).getDate();
  const daysContainer = document.getElementById('calendarDays');
  daysContainer.innerHTML = '';

  for (let i = 0; i < firstDayIndex; i++) {
    const emptyCell = document.createElement('div');
    emptyCell.className = 'calendar-day empty';
    daysContainer.appendChild(emptyCell);
  }

  const today = new Date();
  today.setHours(0,0,0,0);

  for (let day = 1; day <= totalDays; day++) {
    const cell = document.createElement('div');
    cell.className = 'calendar-day';
    cell.textContent = day;
    
    const contextDate = new Date(year, month, day);
    
    if (contextDate < today) {
      cell.classList.add('disabled');
    } else {
      if (selectedDate && contextDate.getTime() === selectedDate.getTime()) {
        cell.classList.add('selected');
      }
      
      cell.onclick = () => {
        selectedDate = contextDate;
        document.getElementById('selectedDateInput').value = contextDate.toISOString().split('T')[0];
        document.querySelectorAll('.calendar-day').forEach(el => el.classList.remove('selected'));
        cell.classList.add('selected');
      };
    }
    daysContainer.appendChild(cell);
  }
}

document.getElementById('prevMonth').onclick = () => {
  currentCalendarDate.setMonth(currentCalendarDate.getMonth() - 1);
  generateCalendar();
};

document.getElementById('nextMonth').onclick = () => {
  currentCalendarDate.setMonth(currentCalendarDate.getMonth() + 1);
  generateCalendar();
};

// --- TAB CATEGORY ACTION CONTROLLERS ---
document.querySelectorAll('.g-tab').forEach(tab => {
  tab.onclick = function() {
    document.querySelectorAll('.g-tab').forEach(t => t.classList.remove('active'));
    this.classList.add('active');
    renderGallery(this.dataset.cat);
  };
});

// --- CONTEXT INITIALIZATION TRIGGER ---
document.addEventListener('DOMContentLoaded', () => {
  renderGallery('sports');
  generateCalendar();
});
