function checkPortalCode() {
  const code = document.getElementById('portalCode').value.trim().toLowerCase();
  const errorEl = document.getElementById('portalError');
  
  if (portalGalleries[code]) {
    errorEl.style.display = 'none';
    window.open(portalGalleries[code], '_blank');
  } else {
    errorEl.style.display = 'block';
  }
}

  ],
  parties: []

let activeCat = 'sports', activeList = [], lbIndex = 0;

const imgObserver = new IntersectionObserver((entries, obs) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      const img = e.target;
      if (img.dataset.src) {
        img.src = img.dataset.src;
        img.removeAttribute('data-src');
      }
      obs.unobserve(img);
    }
  });
}, { rootMargin: '350px 0px', threshold: 0.01 });

let scrollingTicking = false;
window.addEventListener('scroll', () => {
  if (!scrollingTicking) {
    window.requestAnimationFrame(() => {
      const nav = document.getElementById('siteNav');
      if (window.scrollY > 40) {
        nav.classList.add('scrolled');
      } else {
        nav.classList.remove('scrolled');
      }
      scrollingTicking = false;
    });
    scrollingTicking = true;
  }
}, { passive: true });

let calendarDate = new Date();
let chosenDateString = "";
const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

function buildCalendar() {
  const currentYear = calendarDate.getFullYear();
  const currentMonth = calendarDate.getMonth();
  document.getElementById('calendarMonthTitle').textContent = `${monthNames[currentMonth]} ${currentYear}`;
  
  const initialDayIndex = new Date(currentYear, currentMonth, 1).getDay();
  const totalDaysCount = new Date(currentYear, currentMonth + 1, 0).getDate();
  const daysGridContainer = document.getElementById('calendarDaysGrid');
  daysGridContainer.innerHTML = '';
  
  for (let i = 0; i < initialDayIndex; i++) {
    const spaceBlock = document.createElement('div');
    spaceBlock.className = 'calendar-day empty';
    daysGridContainer.appendChild(spaceBlock);
  }
  
  const realTimeToday = new Date();
  realTimeToday.setHours(0,0,0,0);

  for (let dayNum = 1; dayNum <= totalDaysCount; dayNum++) {
    const dayCell = document.createElement('div');
    dayCell.className = 'calendar-day';
    dayCell.textContent = dayNum;
    
    const evaluationDate = new Date(currentYear, currentMonth, dayNum);
    evaluationDate.setHours(23,59,59,999);
    
    if (evaluationDate < realTimeToday) {
      dayCell.classList.add('disabled');
    } else {
      const standardFormatStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
      if (standardFormatStr === chosenDateString) {
        dayCell.classList.add('selected');
      }
      
      dayCell.onclick = () => {
        document.querySelectorAll('.calendar-day').forEach(cell => cell.classList.remove('selected'));
        dayCell.classList.add('selected');
        chosenDateString = standardFormatStr;
        document.getElementById('selectedDateInput').value = chosenDateString;
      };
    }
    daysGridContainer.appendChild(dayCell);
  }
}

document.getElementById('prevMonthBtn').onclick = () => { calendarDate.setMonth(calendarDate.getMonth() - 1); buildCalendar(); };
document.getElementById('nextMonthBtn').onclick = () => { calendarDate.setMonth(calendarDate.getMonth() + 1); buildCalendar(); };

function renderGallery(cat) {
  const grid = document.getElementById('gGrid');
  const frag = document.createDocumentFragment();
  const list = photos[cat] || [];
  activeList = list;
  
  if (list.length === 0) {
    for (let i = 0; i < 3; i++) {
      const d = document.createElement('div');
      d.className = 'g-soon';
      d.textContent = 'Coming Soon';
      frag.appendChild(d);
    }
    grid.innerHTML = '';
    grid.appendChild(frag);
    return;
  }

  list.forEach((file, idx) => {
    const wrap = document.createElement('div');
    wrap.className = 'g-item';
    wrap.onclick = () => openLB(idx);
    
    const img = document.createElement('img');
    img.alt = 'NY Lenses photography display element';
    img.decoding = 'async';
    
    img.addEventListener('load', function() {
      this.classList.add('loaded');
    });
    
    if (idx < 4) {
      img.src = BASE + file;
    } else {
      img.dataset.src = BASE + file;
      img.src = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
      imgObserver.observe(img);
    }
    
    const ov = document.createElement('div');
    ov.className = 'g-overlay';
    const zoom = document.createElement('span');
    zoom.className = 'g-zoom';
    zoom.textContent = '⊕';
    ov.appendChild(zoom);
    
    const wm = document.createElement('span');
    wm.className = 'g-watermark';
    wm.textContent = '© NY Lenses';
    
    wrap.appendChild(img);
    wrap.appendChild(ov);
    wrap.appendChild(wm);
    frag.appendChild(wrap);
  });

  grid.innerHTML = '';
  grid.appendChild(frag);
}

document.querySelectorAll('.g-tab').forEach(t => {
  t.addEventListener('click', (e) => {
    e.stopPropagation();
    document.querySelectorAll('.g-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    activeCat = t.dataset.cat;
    renderGallery(activeCat);
  });
});

function openLB(idx) {
  lbIndex = idx;
  const lbImg = document.getElementById('lb-img');
  lbImg.src = BASE + activeList[idx];
  const lb = document.getElementById('lightbox');
  lb.style.display = 'flex';
  setTimeout(() => lb.classList.add('open'), 10);
  document.body.style.overflow = 'hidden';
}

function closeLB() {
  const lb = document.getElementById('lightbox');
  lb.classList.remove('open');
  document.body.style.overflow = '';
  setTimeout(() => {
    if(!lb.classList.contains('open')) {
      lb.style.display = 'none';
      document.getElementById('lb-img').src = '';
    }
  }, 300);
}

function switchLBImage(newIdx) {
  const lbImg = document.getElementById('lb-img');
  lbImg.classList.add('switching');
  
  setTimeout(() => {
    lbIndex = newIdx;
    lbImg.src = BASE + activeList[lbIndex];
    lbImg.classList.remove('switching');
  }, 100);
}

function prevLB() {
  const newIdx = (lbIndex - 1 + activeList.length) % activeList.length;
  switchLBImage(newIdx);
}

function nextLB() {
  const newIdx = (lbIndex + 1) % activeList.length;
  switchLBImage(newIdx);
}

document.getElementById('lbClose').onclick = closeLB;
document.getElementById('lb-prev').onclick = prevLB;
document.getElementById('lb-next').onclick = nextLB;
document.getElementById('lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') closeLB(); });

document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLB();
  if (e.key === 'ArrowLeft') prevLB();
  if (e.key === 'ArrowRight') nextLB();
});

// Initial startup boots
document.addEventListener('DOMContentLoaded', () => {
  buildCalendar();
  renderGallery('sports');
  
  // Async Formspree configuration bindings
  if (window.formspree) {
    formspree('initForm', { 
      formElement: '#booking-form', 
      formId: 'mzdykadb',
      onSuccess: function(form, data) {
        const successBanner = document.querySelector('[data-fs-success]');
        const errorBanner = document.querySelector('[data-fs-error]');
        if (successBanner) successBanner.style.display = 'block';
        if (errorBanner) errorBanner.style.display = 'none';
        
        form.reset();
        chosenDateString = "";
        document.getElementById('selectedDateInput').value = "";
        buildCalendar();
        if (successBanner) successBanner.scrollIntoView({ behavior: 'smooth', block: 'center' });
      },
      onError: function(form, errors) {
        const errorBanner = document.querySelector('[data-fs-error]');
        if (errorBanner) {
          errorBanner.textContent = "⚠️ Error sending transmission request. Please verify fields and retry.";
          errorBanner.style.display = 'block';
          errorBanner.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
    });
  }
});
